<!DOCTYPE html>
<html>
<head>
    <title>System Audit Logs</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #fff8fb;
            color: #333;
            padding: 30px;
        }

        .box {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border: 2px solid #fdb2d6;
            border-radius: 8px;
        }

        h2 {
            color: #b05882;
            margin-top: 0;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 6px 12px;
            background-color: #fdb2d6;
            border: 1px solid #b05882;
            border-radius: 4px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            background-color: #e696be;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #fdb2d6;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #fff8fb;
            color: #b05882;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>System Audit Logs</h2>
        <a href="{% url 'home' %}" class="back-btn">Back to Dashboard</a>

        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log.timestamp|date:"Y-m-d H:i:s" }}</td>
                    <td><strong>{% if log.user %}{{ log.user.username }}{% else %}System{% endif %}</strong></td>
                    <td>{{ log.action }}</td>
                    <td>{{ log.details|default:"-" }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" style="text-align: center;">No audit logs recorded yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
