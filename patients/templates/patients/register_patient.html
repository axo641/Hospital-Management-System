<!DOCTYPE html>
<html>
<head>
    <title>Register Patient</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #fff8fb;
            color: #333;
            padding: 30px;
        }

        .box {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border: 2px solid #fdb2d6;
            border-radius: 8px;
        }

        h2 {
            color: #b05882;
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #d4a5bc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: "Times New Roman", Times, serif;
        }

        button {
            padding: 10px 15px;
            background-color: #fdb2d6;
            border: 1px solid #b05882;
            border-radius: 5px;
            cursor: pointer;
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
        }

        .errorlist {
            color: #c00;
            list-style: none;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Register Patient</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save Patient</button>
        </form>
    </div>
</body>
</html>
