<!--SO-19: Build and design UI where the staff can search through 
the patient database and it displays the results effectively-->

<!DOCTYPE html>
<html>
<head>
    <title>Patient Search</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #fff8fb;
            color: #333;
            padding: 30px;
        }
        .box {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border: 2px solid #fdb2d6;
        }
        h2 {
            color: #b05882;
        }
        input[type="text"] {
            padding: 8px;
            width: 70%;
            font-family: "Times New Roman", Times, serif;
            border: 1px solid #d4a5bc;
        }
        button {
            padding: 8px 15px;
            background-color: #fdb2d6;
            border: 1px solid #b05882;
            font-family: "Times New Roman", Times, serif;
            cursor: pointer;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #fdb2d6;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #fdb2d6;
            color: white;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Search Patients</h2>
    
    <form method="GET">
        <input type="text" name="q" value="{{ query }}" placeholder="Search name or ID...">
        <button type="submit">Search</button>
    </form>

    {% if query %}
        <p>Results for "{{ query }}":</p>
        {% if patients %}
            <table>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                </tr>
                {% for p in patients %}
                <tr>
                    <td>{{ p.id }}</td>
                    <td>{{ p.first_name }}</td>
                    <td>{{ p.last_name }}</td>
                    <td>{{ p.email }}</td>
                </tr>
                {% endfor %}
            </table>
        {% else %}
            <p>No patients found.</p>
        {% endif %}
    {% endif %}
</div>

</body>
</html>
