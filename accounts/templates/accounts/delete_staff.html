<!DOCTYPE html>
<html>
<head>
    <title>Delete Staff</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #fff8fb;
            color: #333;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border: 2px solid #fdb2d6;
            border-radius: 8px;
        }

        h2 {
            color: #b05882;
            margin-top: 0;
        }

        .warning {
            background-color: #ffebee;
            border: 1px solid #f59bc8;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            color: #c00;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid;
        }

        .delete-btn {
            background-color: #d9534f;
            border-color: #ac2925;
            color: white;
        }

        .delete-btn:hover {
            background-color: #c9302c;
        }

        .cancel-btn {
            background-color: #ccc;
            border-color: #999;
            color: #333;
        }

        .cancel-btn:hover {
            background-color: #bbb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Delete Staff</h2>

        <div class="warning">
            <p><strong>Warning:</strong> Are you sure you want to delete <strong>{{ staff.first_name }} {{ staff.last_name }}</strong>?</p>
            <p>This action cannot be undone. This user will no longer be able to log in.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="button-group">
                <button type="submit" class="delete-btn">Yes, Delete Staff</button>
                <button type="button" class="cancel-btn" onclick="window.location='/accounts/staff/'">Cancel</button>
            </div>
        </form>
    </div>
</body>
</html>
